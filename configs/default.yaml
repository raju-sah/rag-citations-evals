# Baseline config — copy & change ONE field per ablation.
run_name: baseline
corpus_dir: data/raw

language:
  cross_lingual: true
  route_devanagari_to_dense: true

chunk:
  strategy: structure_aware    # structure_aware | fixed
  max_tokens: 500
  overlap_tokens: 60
  min_section_tokens: 80
  tokenizer: BAAI/bge-m3

embedding_model: BAAI/bge-small-en-v1.5

retrieval:
  mode: hybrid                 # dense | bm25 | hybrid
  top_k_candidates: 20
  rrf_k: 60
  faiss_index_type: flat_ip

rerank:
  enabled: true
  model: BAAI/bge-reranker-v2-m3
  top_k: 5
  batch_cache_path: data/cache/rerank_scores.json

llm:
  provider: gemini             # gemini | openai | anthropic | groq
  model: gemini-2.5-flash
  temperature: 0.0
  cache_dir: data/cache/llm_cache

eval:
  golden_set: evals/golden/golden.jsonl
  judge_provider: groq         # groq | gemini
  judge_model: llama-3.3-70b-versatile
  judge_fallback_provider: gemini
  judge_fallback_model: gemini-2.5-flash
  calibration_set: evals/golden/calibration_40.jsonl
  sample_ragas_validation_k: 20

